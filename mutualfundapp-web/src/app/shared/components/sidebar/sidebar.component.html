<!-- Mobile overlay -->
<div class="sidebar-overlay" *ngIf="isMobileOpen" (click)="closeMobile()"></div>

<aside class="sidebar" [class.collapsed]="isCollapsed" [class.mobile-open]="isMobileOpen">

    <!-- ── Logo ──────────────────────────────────────────────── -->
    <div class="sidebar-logo">
        <div class="logo-icon"><i class="fas fa-chart-line"></i></div>
        <span class="logo-text" *ngIf="!isCollapsed">AMFINAV</span>
        <button class="collapse-btn" *ngIf="!isCollapsed" (click)="toggleCollapse()" aria-label="Collapse sidebar">
            <i class="fas fa-chevron-left"></i>
        </button>
    </div>

    <button class="expand-btn" *ngIf="isCollapsed" (click)="toggleCollapse()" aria-label="Expand sidebar">
        <i class="fas fa-chevron-right"></i>
    </button>

    <!-- ── User ──────────────────────────────────────────────── -->
    <div class="sidebar-user" *ngIf="!isCollapsed">
        <div class="user-avatar">{{ userInitials }}</div>
        <div class="user-info">
            <span class="user-name">{{ userName }}</span>
            <span class="user-role">{{ userRole }}</span>
        </div>
    </div>
    <div class="sidebar-user-collapsed" *ngIf="isCollapsed">
        <div class="user-avatar user-avatar-sm">{{ userInitials }}</div>
    </div>

    <div class="sidebar-divider"></div>

    <!-- ── Nav ───────────────────────────────────────────────── -->
    <nav class="sidebar-nav">
        <ul>
            <li *ngFor="let item of visibleNavItems">

                <!-- Expandable item (Portfolio) -->
                <ng-container *ngIf="item.expandable; else normalItem">

                    <button class="nav-item" [class.active]="isActive(item.route)" (click)="togglePortfolio()">
                        <i class="fas {{ item.icon }} nav-icon"></i>
                        <span class="nav-label" *ngIf="!isCollapsed">{{ item.label }}</span>
                        <i class="fas nav-chevron" *ngIf="!isCollapsed" [class.fa-chevron-down]="!portfolioExpanded"
                            [class.fa-chevron-up]="portfolioExpanded"></i>
                        <span class="active-indicator" *ngIf="isActive(item.route)"></span>
                    </button>

                    <!-- Sub-menu -->
                    <ul class="nav-sub-list" *ngIf="portfolioExpanded && !isCollapsed">

                        <!-- Overview link -->
                        <li>
                            <button class="nav-sub-item" [class.active]="activeRoute === '/admin/portfolio'"
                                (click)="navigate(item.route)">
                                <i class="fas fa-chart-pie nav-sub-icon"></i>
                                <span>Overview</span>
                            </button>
                        </li>

                        <!-- Loading state -->
                        <li *ngIf="membersLoading">
                            <div class="nav-sub-loading">
                                <i class="fas fa-circle-notch fa-spin"></i>
                                <span>Loading members…</span>
                            </div>
                        </li>

                        <!-- One row per family member -->
                        <li *ngFor="let member of familyMembers; let i = index">
                            <button class="nav-sub-item"
                                [class.active]="isActive('/admin/portfolio/member/' + member.investorUserId)"
                                (click)="navigate('/admin/portfolio/member/' + member.investorUserId)">
                                <span class="nav-sub-avatar" [attr.data-color]="i % 4">
                                    {{ member.initials }}
                                </span>
                                <span class="nav-sub-name">{{ member.investorName }}</span>
                            </button>
                        </li>

                    </ul>
                </ng-container>

                <!-- Normal item -->
                <ng-template #normalItem>
                    <button class="nav-item" [class.active]="isActive(item.route)" (click)="navigate(item.route)">
                        <i class="fas {{ item.icon }} nav-icon"></i>
                        <span class="nav-label" *ngIf="!isCollapsed">{{ item.label }}</span>
                        <span class="active-indicator" *ngIf="isActive(item.route)"></span>
                    </button>
                </ng-template>

            </li>
        </ul>
    </nav>

    <!-- ── Footer ────────────────────────────────────────────── -->
    <div class="sidebar-footer">
        <div class="sidebar-divider"></div>
        <ul>
            <li>
                <button class="nav-item logout-btn" (click)="logout()">
                    <i class="fas fa-right-from-bracket nav-icon"></i>
                    <span class="nav-label" *ngIf="!isCollapsed">Logout</span>
                </button>
            </li>
        </ul>
    </div>

</aside>
